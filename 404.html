<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klopost ist umgezogen 📬</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://klopost.github.io/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function () {
  var q = location.search || "", h = location.hash || "";
  var target = "https://klopost.github.io/" + q + h;
  if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  location.replace(target);
  document.addEventListener("DOMContentLoaded", function () { var a = document.getElementById("go"); if (a) a.href = target; });
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://klopost.github.io/"></noscript>
